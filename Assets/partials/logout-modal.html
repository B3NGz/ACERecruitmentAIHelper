<!-- ===== LOGOUT MODAL ===== -->
<div id="logoutModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:2000;align-items:center;justify-content:center;padding:2rem;">
  <div style="background:var(--bg-surface);border-radius:var(--radius-card);max-width:420px;width:100%;box-shadow:var(--shadow-card);border:var(--glass-border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);padding:2rem;text-align:center;">

    <!-- SVG LOGOUT ICON -->
    <div style="display:flex;justify-content:center;margin-bottom:1rem;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--clr-charcoal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </div>

    <h3 style="margin-bottom:0.5rem;color:var(--text-primary);">Confirm Logout</h3>
    <p style="color:var(--text-secondary);margin-bottom:1.5rem;">Are you sure you want to logout? You will be redirected to the login page.</p>

    <div style="display:flex;gap:1rem;justify-content:center;">
      <button class="btn" id="confirmLogoutBtn" style="background:var(--clr-charcoal);">Yes, Logout</button>
      <button class="btn btn-secondary" id="cancelLogoutBtn">Cancel</button>
    </div>
  </div>
</div>
